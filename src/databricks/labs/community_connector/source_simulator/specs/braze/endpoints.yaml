# Braze REST Export & Analytics endpoints exercised by the connector.
#
# Auth is a Bearer API key and is ignored by the simulator.
#
# Two response families:
#   * List endpoints (/campaigns/list, /canvas/list, /segments/list,
#     /events/list, /feed/list, /purchases/product_list) — 0-indexed ``page``
#     pagination, records under a named envelope key (campaigns / canvases /
#     segments / events / cards / products). The connector stops on the first
#     short (< page_size) page, so with a small bootstrapped corpus only
#     page 0 is fetched (avoids the simulator's 1-indexed page_number style
#     mapping page 0 and page 1 to the same offset).
#   * Analytics ``data_series`` endpoints — NOT paginated; the whole time
#     series comes back under ``data`` (or nested ``data.stats`` for Canvas).
#     ``length`` / ``ending_at`` / ``starting_at`` / id params are ``ignore``:
#     the simulator returns the full corpus and the connector's fixed
#     init-time cap drives Trigger.AvailableNow termination. Each such
#     endpoint carries ``synthesize_future_records`` so the termination test
#     can verify the connector caps its returned offset at the init snapshot.
#
# The ``/…/details`` endpoints return a single object at the top level in the
# real API; the simulator serves the bootstrapped JSON array and the connector
# takes the first element (then stamps the parent id), so no wrapper/single_entity
# is declared for them.
#
# Each ``corpus`` name matches a table so connector-tester can bootstrap it
# from that table's schema.

endpoints:
  # =====================================================================
  # Campaigns
  # =====================================================================
  - path: /campaigns/list
    method: GET
    corpus: campaigns
    response:
      pagination_style: page_number
      wrapper:
        records_key: campaigns
    params:
      page: {role: page}
      include_archived: {role: ignore}
      sort_direction: {role: ignore}
      "last_edit.time[gt]": {role: ignore}

  - path: /campaigns/details
    method: GET
    corpus: campaigns_details
    response:
      pagination_style: none
    params:
      campaign_id: {role: ignore}
      post_launch_draft_version: {role: ignore}
      include_has_translatable_content: {role: ignore}

  - path: /campaigns/data_series
    method: GET
    corpus: campaigns_analytics
    response:
      pagination_style: none
      wrapper:
        records_key: data
    params:
      campaign_id: {role: ignore}
      length: {role: ignore}
      ending_at: {role: ignore}
    synthesize_future_records:
      cursor_field: time
      count: 3

  # =====================================================================
  # Canvases
