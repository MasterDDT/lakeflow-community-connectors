# Braze REST Export & Analytics endpoints exercised by the connector.
#
# Auth is a Bearer API key and is ignored by the simulator.
#
# Every Braze REST response carries a top-level ``"message": "success"`` field
# alongside its payload (confirmed against the live EU instance). It is modelled
# here so the live validator sees the simulator reproduce it:
#   * flat wrappers declare ``extras: {message: success}`` so the handler emits
#     it at the top level next to the records key;
#   * the Canvas ``data_series`` wrapper is nested (``data.stats``) so ``extras``
#     would land inside ``data`` rather than at the top level — it uses
#     ``ignore_extra_keys: true`` instead;
#   * the ``/…/details`` endpoints are ``single_entity`` and serve the raw
#     detail object from the corpus, which already contains ``message``.
#
# Two response families:
#   * List endpoints (/campaigns/list, /canvas/list, /segments/list,
#     /events/list, /feed/list, /purchases/product_list) — 0-indexed ``page``
#     pagination, records under a named envelope key (campaigns / canvases /
#     segments / events / cards / products). The connector stops on the first
#     short (< page_size) page, so with a small bootstrapped corpus only
#     page 0 is fetched (avoids the simulator's 1-indexed page_number style
#     mapping page 0 and page 1 to the same offset).
#   * Analytics ``data_series`` endpoints — NOT paginated; the whole time
#     series comes back under ``data`` (or nested ``data.stats`` for Canvas).
#     ``length`` / ``ending_at`` / ``starting_at`` / id params are ``ignore``:
#     the simulator returns the full corpus and the connector's fixed
#     init-time cap drives Trigger.AvailableNow termination. Each such
#     endpoint carries ``synthesize_future_records`` so the termination test
#     can verify the connector caps its returned offset at the init snapshot.
#
# The ``/…/details`` endpoints return a single object at the top level in the
# real API (``{"...detail fields...", "message": "success"}``), so they declare
# ``single_entity: true`` and the corpus holds one detail object per stream.
# The connector takes that object (``body[0]`` for a legacy list corpus, else
# the object itself) and stamps the parent id, so every fanned-out call yields
# a distinct primary key.
#
# Each ``corpus`` name matches a table so connector-tester can bootstrap it
# from that table's schema (and re-seed it from a recorded cassette).

endpoints:
  # =====================================================================
  # Campaigns
  # =====================================================================
  - path: /campaigns/list
    method: GET
    corpus: campaigns
    response:
      pagination_style: page_number
      wrapper:
        records_key: campaigns
        extras:
          message: success
    params:
      page: {role: page}
      include_archived: {role: ignore}
      sort_direction: {role: ignore}
      "last_edit.time[gt]": {role: ignore}

  - path: /campaigns/details
    method: GET
    corpus: campaigns_details
    response:
      pagination_style: none
      single_entity: true
    params:
      campaign_id: {role: ignore}
      post_launch_draft_version: {role: ignore}
      include_has_translatable_content: {role: ignore}

  - path: /campaigns/data_series
    method: GET
    corpus: campaigns_analytics
    response:
      pagination_style: none
      wrapper:
        records_key: data
        extras:
          message: success
    params:
      campaign_id: {role: ignore}
      length: {role: ignore}
      ending_at: {role: ignore}
    synthesize_future_records:
      cursor_field: time
      count: 3

  # =====================================================================
  # Canvases
  # =====================================================================
  - path: /canvas/list
    method: GET
    corpus: canvases
    response:
      pagination_style: page_number
      wrapper:
        records_key: canvases
        extras:
          message: success
    params:
      page: {role: page}
      include_archived: {role: ignore}
      sort_direction: {role: ignore}
      "last_edit.time[gt]": {role: ignore}

  - path: /canvas/details
    method: GET
    corpus: canvases_details
    response:
      pagination_style: none
      single_entity: true
    params:
      canvas_id: {role: ignore}
      post_launch_draft_version: {role: ignore}
      include_has_translatable_content: {role: ignore}

  - path: /canvas/data_series
    method: GET
    corpus: canvases_analytics
    response:
      pagination_style: none
      wrapper:
        # Canvas nests its records under ``data.stats``; ``extras`` would land
        # inside ``data`` rather than at the top level, so the top-level
        # ``message`` field is tolerated via ignore_extra_keys instead.
        records_key: data.stats
        ignore_extra_keys: true
    params:
      canvas_id: {role: ignore}
      length: {role: ignore}
      ending_at: {role: ignore}
      starting_at: {role: ignore}
      include_variant_breakdown: {role: ignore}
      include_step_breakdown: {role: ignore}
      include_deleted_step_data: {role: ignore}
    synthesize_future_records:
      cursor_field: time
      count: 3

  # =====================================================================
  # Segments
